<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Summit Flood and Restoration emergency link cover</title>
  <desc id="desc">A premium social preview image with emergency call information and branded restoration theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d46" />
      <stop offset="1" stop-color="#1c5d86" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a2f" />
      <stop offset="1" stop-color="#f14d00" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1020" cy="-30" r="260" fill="#2f88bc" opacity="0.24" />
  <circle cx="-40" cy="620" r="280" fill="#3a9bd3" opacity="0.22" />
  <rect x="70" y="86" width="1060" height="458" rx="28" fill="rgba(6,22,36,0.34)" stroke="rgba(255,255,255,0.18)" />
  <text x="120" y="184" fill="#d4ecff" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="2">SUMMIT FLOOD &amp; RESTORATION</text>
  <text x="120" y="278" fill="#ffffff" font-size="64" font-family="Segoe UI, Arial, sans-serif" font-weight="800">24/7 Emergency Response</text>
  <text x="120" y="348" fill="#d6e9f8" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Rapid dispatch • Insurance-ready documentation • Trusted restoration crews</text>
  <rect x="120" y="404" width="420" height="92" rx="16" fill="url(#accent)" />
  <text x="330" y="462" fill="#ffffff" text-anchor="middle" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="800">(555) 123-4567</text>
  <text x="912" y="492" fill="#e7f4ff" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Flawless Restoration. 45-Minute Arrival.</text>
